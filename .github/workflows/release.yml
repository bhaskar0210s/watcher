name: release

# Pushing a tag such as v1.0.0 builds Watcher and publishes it as a free download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make VERSION="${GITHUB_REF_NAME#v}"
      - name: Package
        run: ditto -c -k --keepParent build/Watcher.app Watcher.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Watcher.zip \
            --title "Watcher ${GITHUB_REF_NAME#v}" \
            --notes "Free and open source. Download Watcher.zip, unzip it and move Watcher.app to Applications. See the README for first-launch steps."
