name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      # Watcher targets macOS 27, which hosted runners don't offer yet, so the smoke
      # test runs a second build made for the runner's macOS.
      - name: Smoke test (sample for 2 s and render every tab)
        run: |
          make BUILD=build-smoke MIN_MACOS=26.0
          build-smoke/Watcher.app/Contents/MacOS/Watcher --snapshot "$RUNNER_TEMP/snapshot" 2
      - name: Package
        run: ditto -c -k --keepParent build/Watcher.app Watcher.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Watcher
          path: Watcher.zip
